name: Atölye testleri

on:
  pull_request:
    paths:
      - "atolye/**"
      - ".github/workflows/atolye.yml"
  push:
    branches: [main]
    paths:
      - "atolye/**"
      - ".github/workflows/atolye.yml"

permissions:
  contents: read

jobs:
  test:
    name: Atölye (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: atolye
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Birim testleri
        run: python -m unittest discover -s tests -t . -v
      - name: Örnek proje denetimi ve üretimi
        run: |
          python -m atolye denetle ornekler/demo-kahve
          python -m atolye uret ornekler/demo-kahve -o "$RUNNER_TEMP/cikti"
