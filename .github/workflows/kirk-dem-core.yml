name: Kırk Dem çekirdek testleri

on:
  pull_request:
    paths:
      - "kirk-dem/unity/Assets/_KirkDem/Runtime/Core/**"
      - "kirk-dem/unity/Assets/_KirkDem/Tests/**"
      - "kirk-dem/tools/core-tests/**"
      - ".github/workflows/kirk-dem-core.yml"
  push:
    branches: [main]
    paths:
      - "kirk-dem/unity/Assets/_KirkDem/Runtime/Core/**"
      - "kirk-dem/unity/Assets/_KirkDem/Tests/**"
      - "kirk-dem/tools/core-tests/**"
      - ".github/workflows/kirk-dem-core.yml"

permissions:
  contents: read

jobs:
  core-tests:
    name: KirkDem.Core (C# 9, NUnit 3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test kirk-dem/tools/core-tests --nologo --logger "console;verbosity=normal"
