name: Platform testleri

# Mimari §4.5 mantığın platform/ci altında workflow_call olarak durmasını öneriyor; ancak GitHub
# yeniden kullanılabilir iş akışlarını yalnız .github/workflows altından çağırabiliyor. Bu yüzden
# şimdilik tek iş akışı burada; modül başına çağırıcılara bölünmesi ikinci projeyle gelir.
on:
  pull_request:
    paths:
      - "platform/**"
      - "ornekler/**"
      - "kirk-oda/tools/metin-denetimi/**"
      - "kirk-oda/localization/**"
      - ".github/workflows/platform.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "ornekler/**"
      - "kirk-oda/tools/metin-denetimi/**"
      - "kirk-oda/localization/**"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

jobs:
  test:
    name: Platform (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (render ve türev testleri; Ubuntu paketi librsvg ile derli)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Birim testleri (marka, metin, medya, animasyon, uretim, ses, kinetik, origami, kolaj)
        run: |
          for d in platform/marka platform/metin platform/medya platform/sablonlar/animasyon platform/uretim platform/ses platform/sablonlar/kinetik platform/sablonlar/origami platform/sablonlar/kolaj; do
            echo "::group::$d"
            python -m unittest discover -s "$d/testler" -v
            echo "::endgroup::"
          done
      - name: Örnek projeleri denetle ve üret
        run: |
          for p in ornekler/*/proje.json; do
            python platform/sablonlar/animasyon/animasyon.py uret "$p" -o "$RUNNER_TEMP/cikti/$(basename "$(dirname "$p")")"
          done
      - name: Kinetik senaryoları denetle
        run: |
          for p in ornekler/*/senaryo.json; do
            python platform/sablonlar/kinetik/kinetik.py denetle "$p" -o "$RUNNER_TEMP/kinetik"
          done
      - name: Origami senaryolarını denetle
        run: |
          for p in ornekler/*/origami.json; do
            python platform/sablonlar/origami/origami.py denetle "$p" -o "$RUNNER_TEMP/origami"
          done
      - name: Kolaj senaryolarını denetle
        run: |
          for p in platform/sablonlar/kolaj/ornek/senaryo.json ornekler/*/kolaj.json; do
            [ -e "$p" ] || continue
            python platform/sablonlar/kolaj/kolaj.py denetle "$p" -o "$RUNNER_TEMP/kolaj"
          done
      - name: Tek çizgi şablonu (testler ve senaryo denetimi)
        run: |
          python -m pip install -q numpy
          python -m unittest discover -s platform/sablonlar/tek_cizgi/testler -v
          for p in ornekler/*/tek-cizgi.json; do
            python platform/sablonlar/tek_cizgi/tek_cizgi.py denetle "$p" -o "$RUNNER_TEMP/tek-cizgi"
          done
      - name: Örnek projelerin üretim planı ve lisans kapısı (prova sağlayıcı, ağ yok)
        run: |
          for p in ornekler/*/proje.json; do
            python platform/uretim/uretim.py plan "$p"
            python platform/uretim/uretim.py denetle "$p"
          done
      - name: Örnek projelerin render'ı (bumper; YZ klibi yoksa yer tutucu)
        run: |
          for p in ornekler/*/proje.json; do
            python platform/sablonlar/animasyon/animasyon.py render "$p" --teslim youtube-bumper \
              -o "$RUNNER_TEMP/render/$(basename "$(dirname "$p")")"
          done
